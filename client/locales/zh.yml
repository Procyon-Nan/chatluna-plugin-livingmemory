tab.guide: 插件指南
guide.start: 第一次使用
guide.models.title: 配置模型
guide.models.text: 在「插件配置 → 模型配置」选择模型。主模型提取和整理记忆、生成画像；召回模型判断当前聊天是否需要查找记忆。嵌入模型将记忆和查询文本转换为向量，供插件比较语义相似度。重排序模型是可选的：它根据查询与每条候选记忆的相关性，重新排列检索结果。点「保存设置」后，这些选择对当前插件实例的所有预设生效。
guide.openSettings: 打开插件配置
guide.rules.title: 选择在哪些对话中自动提取记忆
guide.rules.text: 在「对话规则 → 能力 → LivingMemory」设置「自动提取间隔」，默认是 60 条聊天消息。要只在某个群自动提取，把全局间隔设为 0，再把该群规则的间隔设为 60。
guide.check.title: 用一条记忆试试检索
guide.check.text: 在「记忆」页点「新建记忆」，选好预设，写下“我喝咖啡不加糖”并保存。到同一预设的「召回测试」搜索“我喜欢喝什么咖啡”，查看检索结果。测试不会更新快照。实际聊天的快照正文在「快照」页查看，展开「召回详情」可以看到搜索词和命中的记忆。
guide.questions: 常用设置怎么选？
guide.interval.title: 「自动召回间隔」和「召回上下文条数」有什么区别？
guide.interval.text: 两项都在对话规则中，默认都是 20 条。「自动召回间隔」决定何时查找记忆：首次唤醒时已有聊天就会召回；之后每次唤醒时，如果距上次召回的新增消息数达到你设置的间隔，就再次召回。间隔设为 0 会关闭自动召回。「召回上下文条数」决定每次唤醒时向前读多少条聊天。
guide.overheard.title: 群友之间的闲聊什么时候会触发提取？
guide.overheard.text: 「提取旁听消息」默认关闭：群友一直闲聊时不会触发提取。等机器人回复后，插件才统计截至这条回复的未处理消息；先前的闲聊也计入条数，达到间隔就提取。开启后，群友的消息达到间隔就会触发提取，无需叫机器人或等它回复。
guide.sharing.title: 同一预设下的两个群能共用快照吗？
guide.sharing.text: 默认每个会话各用一份快照。要让同一预设下的两个群共用一份，在两个群的对话规则中都选择「记忆快照范围 → 预设共享快照」。共享的是召回结果，两个群仍各自读取聊天记录、计算召回间隔。开启「隔离会话检索」的群始终使用独立快照，并且只检索该预设下本群和全局的记忆。
guide.profiles.title: 已经生成了用户画像，怎样在聊天中使用？
guide.profiles.text: 默认在提取或 Dream 整理后更新画像，每位用户至少需要 3 条关联的活跃记忆。这些条件在「插件配置」中调整。要让机器人在聊天中使用已有画像，还需在对话规则中打开「注入用户画像」（默认关闭）。注入哪些人的画像，取决于本次召回上下文里有哪些用户发过言。
guide.dream.title: Dream 如何整理记忆
guide.dream.intro: Dream 让主模型对照已有的记忆，决定哪些该保留、更新、合并、拆分或归档。例如，“我喝咖啡不加糖”和“我喜欢无糖咖啡”可以合并成一条偏好。使用 Dream 时，请选择上下文窗口至少为 200k tokens 的主模型。
guide.dream.auto.title: 自动整理：从刚提取的新记忆开始
guide.dream.auto.text: 对话规则中的「提取后整理新记忆」默认开启。每次自动提取保存新记忆后，Dream 会为每条新记忆查找同一预设下相关的活跃旧记忆，放在一起整理。找不到相关旧记忆时，新条目保持原样。
guide.dream.manual.title: 手动整理：检查整个预设
guide.dream.manual.text: 预设里至少有 30 条活跃记忆时，可以在「记忆」页选择该预设，点「运行 Dream」。Dream 会把活跃记忆按内容相关性分组，逐组检查。30 条的门槛只用于手动整理。
guide.dream.result.title: 查看整理结果
guide.dream.result.text: 在同一预设的「任务」页查看处理条数、操作统计和失败原因。改动会直接保存到「记忆」页；要查看合并或拆分前的原条目，把状态筛选切到「已归档」。
